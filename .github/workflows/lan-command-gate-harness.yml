name: Validate LAN trusted Slice-1 command gate

on:
  push:
    branches: [main]
    paths:
      - 'contracts/commands.slice1.v1.json'
      - 'lan-service/**'
      - 'lan-service-harness/**'
      - 'lan-command-gate-harness/**'
      - '.github/workflows/lan-command-gate-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lan-command-gate-harness
  cancel-in-progress: true

jobs:
  command-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build LAN runtime and command-gate harnesses
        shell: bash
        run: |
          set -euo pipefail
          dotnet build lan-service/Vhdchy.LanService.csproj -c Release
          dotnet build lan-service-harness/Vhdchy.LanService.Harness.csproj -c Release
          dotnet build lan-command-gate-harness/Vhdchy.LanCommandGate.Harness.csproj -c Release

      - name: Initialize real EdgeStore
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/vhdchy-command-gate"
          rm -rf "$data_root"
          mkdir -p "$data_root"
          echo "DATA_ROOT=$data_root" >> "$GITHUB_ENV"

          VHDCHY_ENV=BETA \
          VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
          VHDCHY_LAN_PORT=17913 \
          VHDCHY_LAN_DATA_ROOT="$data_root" \
            dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$RUNNER_TEMP/lan-init.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ok=false
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lan-init.log" || true
              exit 1
            fi
            code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' http://127.0.0.1:17913/health || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 0.5
          done
          test "$ok" = "true"
          jq -e '.readiness == "EDGE_EMPTY" and .businessMutationEnabled == false' "$RUNNER_TEMP/health.json" >/dev/null
          kill "$pid"
          wait "$pid" || true
          trap - EXIT

      - name: Populate synchronized authority evidence
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project lan-service-harness/Vhdchy.LanService.Harness.csproj -c Release --no-build -- "$DATA_ROOT/edge.db" | tee "$RUNNER_TEMP/base-harness.log"
          grep -Fq 'LAN_AUTHORITY_SNAPSHOT_HARNESS_PASS' "$RUNNER_TEMP/base-harness.log"
          grep -Fq 'LAN_AUTHORIZATION_HARNESS_PASS' "$RUNNER_TEMP/base-harness.log"

      - name: Prove embedded trusted command vocabulary and authorization mappings
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project lan-command-gate-harness/Vhdchy.LanCommandGate.Harness.csproj -c Release --no-build -- "$DATA_ROOT/edge.db" | tee "$RUNNER_TEMP/command-gate.log"
          grep -Fq 'LAN_COMMAND_GATE_HARNESS_PASS' "$RUNNER_TEMP/command-gate.log"

          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='authority_snapshot_version';")" = "AUTH-TEST-2"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "PRAGMA foreign_key_check;")" = ""
          test "$(sqlite3 "$DATA_ROOT/edge.db" "PRAGMA quick_check;")" = "ok"
