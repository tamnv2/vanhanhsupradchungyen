name: Cloudflare Worker BETA multi-module deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/cloudflare-beta-deploy-v2.json'

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-beta-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: beta
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate fixed dispatch and reviewed module manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          jq -e '.enabled == true and .target == "beta" and .operation == "deploy_worker_multimodule_business_core_v3"' .github/dispatch/cloudflare-beta-deploy-v2.json >/dev/null
          jq -e '
            .target_worker == "vhdchy-beta" and
            .public_origin == "https://beta.supra.cc.cd" and
            .workers_dev_expected == false and
            .d1_binding.name == "DB" and
            .d1_binding.database_name == "vhdchy-data-beta" and
            .d1_binding.database_id == "37eb7d59-05c0-4ba2-8162-cb6a9fe5d492" and
            .vars.APP_ENV == "BETA" and
            .expected_runtime.schema_version == "business_core_v3" and
            .expected_runtime.runtime_state == "BUSINESS_CORE_V3"
          ' service/worker/deploy.beta.json >/dev/null
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const spec = JSON.parse(fs.readFileSync('service/worker/deploy.beta.json', 'utf8'));
          const dir = path.dirname(spec.source);
          if (!Array.isArray(spec.modules) || spec.modules.length < 2) throw new Error('multi-module manifest required');
          for (const name of spec.modules) {
            if (path.basename(name) !== name || !name.endsWith('.js')) throw new Error(`invalid module ${name}`);
            const file = path.join(dir, name);
            if (!fs.existsSync(file)) throw new Error(`missing module ${file}`);
          }
          if (!spec.modules.includes(path.basename(spec.source))) throw new Error('main module missing from manifest');
          console.log(`WORKER_MODULE_MANIFEST_PASS modules=${spec.modules.length}`);
          NODE
          for source in service/worker/src/*.js; do node --input-type=module --check < "$source"; done

      - name: Read-only provider preflight
        shell: bash
        run: node .github/scripts/cloudflare-verify.mjs | tee "$RUNNER_TEMP/provider-preflight.log"

      - name: Enforce exact BETA precondition
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const log = fs.readFileSync(`${process.env.RUNNER_TEMP}/provider-preflight.log`, 'utf8');
          const lines = log.split(/\r?\n/);
          const value = (prefix) => {
            const line = lines.find(x => x.startsWith(prefix));
            if (!line) throw new Error(`Missing preflight evidence: ${prefix}`);
            return line.slice(prefix.length);
          };
          if (value('WORKER_FOUND=') !== 'yes') throw new Error('BETA Worker missing');
          if (value('D1_DATABASE_ID=') !== '37eb7d59-05c0-4ba2-8162-cb6a9fe5d492') throw new Error('D1 identity mismatch');
          if (value('D1_SCHEMA_VERSION=') !== 'business_core_v3') throw new Error('D1 schema mismatch');
          if (value('WORKERS_DEV_ENABLED=') !== 'no') throw new Error('unexpected workers.dev state');
          const domains = JSON.parse(value('WORKER_CUSTOM_DOMAINS='));
          if (domains.length !== 1 || domains[0]?.hostname !== 'beta.supra.cc.cd') throw new Error(`unexpected domains ${JSON.stringify(domains)}`);
          console.log('WORKER_MULTI_MODULE_PRECHECK_PASS');
          NODE

      - name: Upload reviewed Worker modules
        shell: bash
        run: node .github/scripts/cloudflare-worker-upload.mjs service/worker/deploy.beta.json

      - name: Read-only provider postflight
        shell: bash
        run: node .github/scripts/cloudflare-verify.mjs | tee "$RUNNER_TEMP/provider-postflight.log"

      - name: Enforce post-state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const log = fs.readFileSync(`${process.env.RUNNER_TEMP}/provider-postflight.log`, 'utf8');
          const lines = log.split(/\r?\n/);
          const value = (prefix) => {
            const line = lines.find(x => x.startsWith(prefix));
            if (!line) throw new Error(`Missing postflight evidence: ${prefix}`);
            return line.slice(prefix.length);
          };
          if (value('D1_SCHEMA_VERSION=') !== 'business_core_v3') throw new Error('postflight D1 schema mismatch');
          if (value('WORKERS_DEV_ENABLED=') !== 'no') throw new Error('workers.dev changed');
          const domains = JSON.parse(value('WORKER_CUSTOM_DOMAINS='));
          if (domains.length !== 1 || domains[0]?.hostname !== 'beta.supra.cc.cd') throw new Error('custom domain changed');
          console.log('WORKER_MULTI_MODULE_POSTCHECK_PASS');
          NODE

      - name: Verify public BETA health
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const spec = JSON.parse(fs.readFileSync('service/worker/deploy.beta.json', 'utf8'));
          async function get(path) {
            const response = await fetch(`${spec.public_origin}${path}`, { cache: 'no-store', redirect: 'follow' });
            const text = await response.text();
            let payload;
            try { payload = JSON.parse(text); } catch { throw new Error(`${path} non-JSON HTTP ${response.status}`); }
            if (!response.ok) throw new Error(`${path} HTTP ${response.status}: ${text.slice(0, 800)}`);
            return payload;
          }
          const health = await get('/health');
          if (health?.ok !== true || health?.environment !== 'BETA' || health?.build !== process.env.GITHUB_SHA || health?.d1?.schemaVersion !== 'business_core_v3') throw new Error('/health mismatch');
          const deep = await get('/health/deep');
          if (deep?.ok !== true || deep?.environment !== 'BETA' || deep?.build !== process.env.GITHUB_SHA || deep?.d1?.schemaVersion !== 'business_core_v3') throw new Error('/health/deep mismatch');
          const meta = await get('/api/v1/meta');
          if (meta?.ok !== true || meta?.runtimeState !== 'BUSINESS_CORE_V3' || meta?.build !== process.env.GITHUB_SHA) throw new Error('/api/v1/meta mismatch');
          const capabilities = await get('/api/v1/capabilities');
          if (capabilities?.ok !== true || capabilities?.authority !== 'D1' || capabilities?.anonymousMutationAllowed !== false) throw new Error('/api/v1/capabilities mismatch');
          console.log(`WORKER_MULTI_MODULE_HEALTH_PASS origin=${spec.public_origin}`);
          NODE
