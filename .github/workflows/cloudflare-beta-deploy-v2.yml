name: Cloudflare Worker BETA multi-module deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/cloudflare-beta-deploy-v2.json'

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-beta-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: beta
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LAN_RECONCILIATION_SHARED_SECRET: ${{ secrets.LAN_RECONCILIATION_SHARED_SECRET }}
      VHDCHY_PROJECTION_SHARED_TOKEN: ${{ secrets.VHDCHY_PROJECTION_SHARED_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Read fixed dispatch state
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          jq -e '(.enabled == true or .enabled == false) and .target == "beta" and .operation == "deploy_worker_multimodule_business_core_v3"' .github/dispatch/cloudflare-beta-deploy-v2.json >/dev/null
          enabled="$(jq -r '.enabled' .github/dispatch/cloudflare-beta-deploy-v2.json)"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo "WORKER_MULTI_MODULE_DISPATCH_DISABLED_NOOP"
          fi

      - name: Validate reviewed module and credential manifest
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .target_worker == "vhdchy-beta" and
            .source == "service/worker/src/worker-entry.js" and
            .public_origin == "https://beta.supra.cc.cd" and
            .workers_dev_expected == false and
            .cron_schedules == ["*/2 * * * *"] and
            .d1_binding.name == "DB" and
            .d1_binding.database_name == "vhdchy-data-beta" and
            .d1_binding.database_id == "37eb7d59-05c0-4ba2-8162-cb6a9fe5d492" and
            .vars.APP_ENV == "BETA" and
            .vars.PROJECTION_DELIVERY_ENABLED == "true" and
            .vars.LAN_RECONCILIATION_KEY_ID == "vhdchy-beta-lan-reconciliation-01" and
            .vars.LAN_RECONCILIATION_FINALITY_V1 == "disabled" and
            (.secret_env_bindings | length) == 2 and
            ([.secret_env_bindings[] | select(.name == "LAN_RECONCILIATION_SHARED_SECRET" and .env == "LAN_RECONCILIATION_SHARED_SECRET" and .min_length >= 32)] | length) == 1 and
            ([.secret_env_bindings[] | select(.name == "VHDCHY_PROJECTION_SHARED_TOKEN" and .env == "VHDCHY_PROJECTION_SHARED_TOKEN" and .min_length >= 32)] | length) == 1 and
            .expected_runtime.schema_version == "business_core_v3" and
            .expected_runtime.runtime_state == "BUSINESS_CORE_V3"
          ' service/worker/deploy.beta.json >/dev/null
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const spec = JSON.parse(fs.readFileSync('service/worker/deploy.beta.json', 'utf8'));
          const dir = path.dirname(spec.source);
          if (!Array.isArray(spec.modules) || spec.modules.length < 2) throw new Error('multi-module manifest required');
          for (const name of spec.modules) {
            if (path.basename(name) !== name || !name.endsWith('.js')) throw new Error(`invalid module ${name}`);
            const file = path.join(dir, name);
            if (!fs.existsSync(file)) throw new Error(`missing module ${file}`);
          }
          if (!spec.modules.includes(path.basename(spec.source))) throw new Error('main module missing from manifest');
          console.log(`WORKER_MODULE_MANIFEST_PASS modules=${spec.modules.length}`);
          NODE
          for source in service/worker/src/*.js; do node --input-type=module --check < "$source"; done

      - name: Require secret-store inputs
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "${#LAN_RECONCILIATION_SHARED_SECRET}" -ge 32
          test "${#VHDCHY_PROJECTION_SHARED_TOKEN}" -ge 32
          echo 'RECONCILIATION_SECRET_STORE_INPUT_PASS'
          echo 'PROJECTION_SECRET_STORE_INPUT_PASS'

      - name: Read-only provider preflight before credential provisioning
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: node .github/scripts/cloudflare-worker-predeploy.mjs

      - name: Upload reviewed Worker modules credentials and cron
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: node .github/scripts/cloudflare-worker-upload.mjs service/worker/deploy.beta.json

      - name: Read-only provider postflight
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: node .github/scripts/cloudflare-verify.mjs | tee "$RUNNER_TEMP/provider-postflight.log"

      - name: Enforce post-state
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const log = fs.readFileSync(`${process.env.RUNNER_TEMP}/provider-postflight.log`, 'utf8');
          const lines = log.split(/\r?\n/);
          const value = (prefix) => {
            const line = lines.find(x => x.startsWith(prefix));
            if (!line) throw new Error(`Missing postflight evidence: ${prefix}`);
            return line.slice(prefix.length);
          };
          if (value('D1_SCHEMA_VERSION=') !== 'business_core_v3') throw new Error('postflight D1 schema mismatch');
          if (value('WORKERS_DEV_ENABLED=') !== 'no') throw new Error('workers.dev changed');
          const domains = JSON.parse(value('WORKER_CUSTOM_DOMAINS='));
          if (domains.length !== 1 || domains[0]?.hostname !== 'beta.supra.cc.cd') throw new Error('custom domain changed');
          if (!log.includes('WORKER_RUNTIME_BINDINGS_PASS')) throw new Error('runtime bindings did not pass postflight');
          if (value('WORKER_PROJECTION_DELIVERY_ENABLED=') !== 'true') throw new Error('projection delivery gate did not activate');
          const schedules = JSON.parse(value('WORKER_CRON_SCHEDULES='));
          if (JSON.stringify(schedules) !== JSON.stringify(['*/2 * * * *'])) throw new Error('projection cron schedule mismatch');
          if (!log.includes('D1_RECONCILIATION_TABLES_PASS')) throw new Error('reconciliation tables did not pass postflight');
          if (!log.includes('D1_EDGE_INGEST_COLUMNS_PASS')) throw new Error('reconciliation columns did not pass postflight');
          console.log('WORKER_MULTI_MODULE_POSTCHECK_PASS');
          NODE

      - name: Verify public BETA health after edge propagation
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const fs = await import('node:fs');
          const spec = JSON.parse(fs.readFileSync('service/worker/deploy.beta.json', 'utf8'));
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
          async function get(path) {
            const response = await fetch(`${spec.public_origin}${path}`, { cache: 'no-store', redirect: 'follow' });
            const text = await response.text();
            let payload;
            try { payload = JSON.parse(text); }
            catch { return { transportOk: false, status: response.status, text: text.slice(0, 800) }; }
            return { transportOk: response.ok, status: response.status, payload };
          }
          async function expectedBuild(path, predicate) {
            let last;
            for (let attempt = 1; attempt <= 12; attempt++) {
              last = await get(path);
              const payload = last.payload;
              if (last.transportOk && predicate(payload)) return payload;
              console.log(`HEALTH_WAIT path=${path} attempt=${attempt} status=${last.status} body=${JSON.stringify(payload || last.text).slice(0, 1200)}`);
              if (attempt < 12) await sleep(2500);
            }
            throw new Error(`${path} did not converge to expected build ${process.env.GITHUB_SHA}; last=${JSON.stringify(last).slice(0, 1600)}`);
          }
          const health = await expectedBuild('/health', p => p?.ok === true && p?.environment === 'BETA' && p?.build === process.env.GITHUB_SHA && p?.d1?.schemaVersion === 'business_core_v3');
          const deep = await expectedBuild('/health/deep', p => p?.ok === true && p?.environment === 'BETA' && p?.build === process.env.GITHUB_SHA && p?.d1?.schemaVersion === 'business_core_v3');
          const meta = await expectedBuild('/api/v1/meta', p => p?.ok === true && p?.runtimeState === 'BUSINESS_CORE_V3' && p?.build === process.env.GITHUB_SHA);
          const capabilities = await expectedBuild('/api/v1/capabilities', p => p?.ok === true && p?.authority === 'D1' && p?.anonymousMutationAllowed === false);
          console.log(`WORKER_MULTI_MODULE_HEALTH_PASS origin=${spec.public_origin} build=${health.build} google_degraded=${deep?.degraded === true ? 'yes' : 'no'} runtime=${meta.runtimeState} authority=${capabilities.authority}`);
          NODE
