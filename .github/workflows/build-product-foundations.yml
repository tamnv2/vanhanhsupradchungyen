name: Build product foundations

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'lan-service/**'
      - 'contracts/**'
      - 'config/permissions.v1.json'
      - 'service/worker/migrations/0011_permission_catalog_v1.sql'
      - '.github/scripts/domain-parity-test.mjs'
      - '.github/workflows/build-product-foundations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-foundations-build
  cancel-in-progress: true

jobs:
  web-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Website foundation and shared contract
        shell: bash
        run: |
          set -euo pipefail
          test -s web/index.html
          test -s web/app.js
          test -s web/styles.css
          test -s contracts/domain.v1.json
          test -s contracts/commands.slice1.v1.json
          test -s contracts/acceptance.v1.json
          test -s contracts/mutation-result.v1.schema.json
          test -s config/permissions.v1.json
          grep -Fq 'VẬN HÀNH DC HƯNG YÊN' web/index.html
          grep -Fq 'LAN_ACCEPTED_PENDING_SYNC' web/app.js
          jq -e '.contractVersion == "VHDCHY_DOMAIN_V1"' contracts/domain.v1.json >/dev/null
          jq -e '.schemaVersion == "VHDCHY_COMMAND_SPEC_V1"' contracts/commands.slice1.v1.json >/dev/null
          jq -e '.schemaVersion == "VHDCHY_ACCEPTANCE_V1"' contracts/acceptance.v1.json >/dev/null
          jq -e '.$id == "VHDCHY_MUTATION_RESULT_V1"' contracts/mutation-result.v1.schema.json >/dev/null
          jq -e '.schemaVersion == "VHDCHY_PERMISSION_CATALOG_V1"' config/permissions.v1.json >/dev/null
          node .github/scripts/domain-parity-test.mjs
          mkdir -p out/web
          cp -R web/. out/web/
          tar -C out/web -czf out/VHDCHY-WEB-foundation.tar.gz .
          sha256sum out/VHDCHY-WEB-foundation.tar.gz > out/VHDCHY-WEB-foundation.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: web-foundation
          path: |
            out/VHDCHY-WEB-foundation.tar.gz
            out/VHDCHY-WEB-foundation.tar.gz.sha256
          if-no-files-found: error

  lan-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and smoke-test LAN Service
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/domain-parity-test.mjs
          dotnet build lan-service/Vhdchy.LanService.csproj -c Release

          data_root="$RUNNER_TEMP/vhdchy-lan-beta"
          rm -rf "$data_root"
          mkdir -p "$data_root"

          start_service() {
            local log_path="$1"
            VHDCHY_ENV=BETA \
            VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
            VHDCHY_LAN_PORT=17901 \
            VHDCHY_LAN_DATA_ROOT="$data_root" \
              dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$log_path" 2>&1 &
            pid=$!
          }

          wait_for_health() {
            local log_path="$1"
            local health_path="$2"
            local health_ok=false
            for i in $(seq 1 30); do
              if ! kill -0 "$pid" 2>/dev/null; then
                echo 'LAN Service exited before health became ready'
                cat "$log_path" || true
                exit 1
              fi
              code=$(curl --noproxy '*' -sS -o "$health_path" -w '%{http_code}' http://127.0.0.1:17901/health || true)
              if [ "$code" = "200" ]; then
                health_ok=true
                break
              fi
              sleep 0.5
            done
            if [ "$health_ok" != "true" ]; then
              echo 'LAN /health did not become HTTP 200'
              cat "$log_path" || true
              cat "$health_path" || true
              exit 1
            fi
          }

          start_service "$RUNNER_TEMP/lan-service.log"
          trap 'kill ${pid:-0} 2>/dev/null || true' EXIT
          wait_for_health "$RUNNER_TEMP/lan-service.log" "$RUNNER_TEMP/health.json"

          jq -e '
            .ok == true and
            .service == "VHDCHY_LAN_SERVICE" and
            .environment == "BETA" and
            .clusterId == "PICK_PACK_1291" and
            .edgeSchemaVersion == "VHDCHY_EDGE_V2" and
            .edgeStoreReady == true and
            .edgeStoreIntegrity == "PASS" and
            .readiness == "EDGE_EMPTY" and
            .businessMutationEnabled == false
          ' "$RUNNER_TEMP/health.json" >/dev/null

          instance_id="$(jq -r '.instanceId' "$RUNNER_TEMP/health.json")"
          test -n "$instance_id"
          test -s "$data_root/instance-id.txt"
          test -s "$data_root/edge.db"

          for table in edge_meta authority_snapshots operational_snapshot_state module_current_state edge_events edge_reconciliation_state cloud_sync_outbox google_projection_outbox drive_upload_outbox integration_receipts edge_conflicts; do
            test "$(sqlite3 "$data_root/edge.db" "SELECT count(*) FROM sqlite_master WHERE type='table' AND name='${table}';")" = "1"
          done
          for trigger in trg_edge_events_no_update trg_edge_events_no_delete; do
            test "$(sqlite3 "$data_root/edge.db" "SELECT count(*) FROM sqlite_master WHERE type='trigger' AND name='${trigger}';")" = "1"
          done
          test "$(sqlite3 "$data_root/edge.db" "PRAGMA quick_check;")" = "ok"
          test "$(sqlite3 "$data_root/edge.db" "PRAGMA foreign_key_check;")" = ""
          test "$(sqlite3 "$data_root/edge.db" "SELECT count(*) FROM edge_events;")" = "0"
          test "$(sqlite3 "$data_root/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='environment';")" = "BETA"
          test "$(sqlite3 "$data_root/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='cluster_id';")" = "PICK_PACK_1291"
          test "$(sqlite3 "$data_root/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='edge_schema_version';")" = "VHDCHY_EDGE_V2"

          curl --noproxy '*' -fsS http://127.0.0.1:17901/api/v1/meta | jq -e '
            .runtime == "LAN" and
            .domainContractVersion == "VHDCHY_DOMAIN_V1" and
            .edgeSchemaVersion == "VHDCHY_EDGE_V2"
          ' >/dev/null
          curl --noproxy '*' -fsS http://127.0.0.1:17901/api/v1/sync/status | jq -e '
            .ok == true and
            .readiness == "EDGE_EMPTY" and
            .pendingCloudSync == 0 and
            .pendingGoogleWork == 0 and
            .conflictCount == 0
          ' >/dev/null
          curl --noproxy '*' -fsS http://127.0.0.1:17901/api/v1/capabilities | jq -e '
            .businessMutationEnabled == false and
            (.supports | index("EDGE_STATE_LOCAL_DURABLE") != null) and
            (.supports | index("CLOUD_SYNC_ENGINE_PLANNED") != null)
          ' >/dev/null
          curl --noproxy '*' -fsS http://127.0.0.1:17901/ | grep -Fq 'VẬN HÀNH DC HƯNG YÊN'

          code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/mutation.json" -w '%{http_code}' -X POST http://127.0.0.1:17901/api/v1/data/test)
          test "$code" = "503"
          jq -e '.ok == false and .error.code == "RUNTIME_DEPENDENCY_UNAVAILABLE"' "$RUNNER_TEMP/mutation.json" >/dev/null

          kill "$pid"
          wait "$pid" || true

          start_service "$RUNNER_TEMP/lan-service-restart.log"
          wait_for_health "$RUNNER_TEMP/lan-service-restart.log" "$RUNNER_TEMP/health-restart.json"
          test "$(jq -r '.instanceId' "$RUNNER_TEMP/health-restart.json")" = "$instance_id"
          test "$(jq -r '.edgeStoreIntegrity' "$RUNNER_TEMP/health-restart.json")" = "PASS"
          kill "$pid"
          wait "$pid" || true
          trap - EXIT

          set +e
          VHDCHY_ENV=STABLE \
          VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
          VHDCHY_LAN_PORT=17902 \
          VHDCHY_LAN_DATA_ROOT="$data_root" \
            dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$RUNNER_TEMP/lan-service-mismatch.log" 2>&1
          mismatch_exit=$?
          set -e
          test "$mismatch_exit" -ne 0
          grep -Fq 'EDGE_IDENTITY_MISMATCH environment' "$RUNNER_TEMP/lan-service-mismatch.log"

      - name: Publish portable no-admin Windows package
        shell: bash
        run: |
          set -euo pipefail
          version="0.1.${GITHUB_RUN_NUMBER}"
          dotnet publish lan-service/Vhdchy.LanService.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:Version="$version" \
            -o out/lan-service
          printf '%s\n' "$version" > out/lan-service/VERSION.txt
          (cd out/lan-service && zip -r ../VHDCHY-LAN-Service-BETA-win-x64.zip .)
          sha256sum out/VHDCHY-LAN-Service-BETA-win-x64.zip > out/VHDCHY-LAN-Service-BETA-win-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lan-service-foundation
          path: |
            out/VHDCHY-LAN-Service-BETA-win-x64.zip
            out/VHDCHY-LAN-Service-BETA-win-x64.zip.sha256
          if-no-files-found: error
