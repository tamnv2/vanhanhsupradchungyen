name: Cloudflare D1 BETA legacy migration guard

on:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/cloudflare-beta-migrate.json'

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-beta-migrate
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    environment: beta

    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4

      - name: Enforce retired one-shot migration state
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

          jq -e '
            (.enabled == true or .enabled == false) and
            .target == "beta" and
            .operation == "migrate_business_core_v3"
          ' .github/dispatch/cloudflare-beta-migrate.json >/dev/null

          enabled="$(jq -r '.enabled' .github/dispatch/cloudflare-beta-migrate.json)"
          if [ "$enabled" = "true" ]; then
            echo 'LEGACY_BETA_V1_TO_V3_MIGRATION_RETIRED'
            echo 'The reviewed one-shot business_core_v1 -> business_core_v3 migration has already completed and must not be replayed.'
            echo 'Use a separately reviewed additive migration workflow for any later schema change.'
            exit 1
          fi

          echo 'LEGACY_BETA_MIGRATION_DISABLED_NOOP'
