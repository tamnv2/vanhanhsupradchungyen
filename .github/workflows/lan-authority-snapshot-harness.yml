name: Validate LAN authority snapshot atomicity

on:
  push:
    branches: [main]
    paths:
      - 'lan-service/**'
      - 'lan-service-harness/**'
      - '.github/workflows/lan-authority-snapshot-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lan-authority-snapshot-harness
  cancel-in-progress: true

jobs:
  authority-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build LAN service and harness
        shell: bash
        run: |
          set -euo pipefail
          dotnet build lan-service/Vhdchy.LanService.csproj -c Release
          dotnet build lan-service-harness/Vhdchy.LanService.Harness.csproj -c Release

      - name: Initialize real EdgeStore
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/vhdchy-authority-harness"
          rm -rf "$data_root"
          mkdir -p "$data_root"
          echo "DATA_ROOT=$data_root" >> "$GITHUB_ENV"

          VHDCHY_ENV=BETA \
          VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
          VHDCHY_LAN_PORT=17911 \
          VHDCHY_LAN_DATA_ROOT="$data_root" \
            dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$RUNNER_TEMP/lan-init.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ok=false
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lan-init.log" || true
              exit 1
            fi
            code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/health-init.json" -w '%{http_code}' http://127.0.0.1:17911/health || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 0.5
          done
          test "$ok" = "true"
          jq -e '.edgeSchemaVersion == "VHDCHY_EDGE_V2" and .readiness == "EDGE_EMPTY" and .businessMutationEnabled == false' "$RUNNER_TEMP/health-init.json" >/dev/null
          kill "$pid"
          wait "$pid" || true
          trap - EXIT
          test -s "$data_root/edge.db"

      - name: Run authority and local-command atomicity vectors
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project lan-service-harness/Vhdchy.LanService.Harness.csproj -c Release --no-build -- "$DATA_ROOT/edge.db" | tee "$RUNNER_TEMP/authority-harness.log"
          grep -Fq 'LAN_AUTHORITY_SNAPSHOT_HARNESS_PASS' "$RUNNER_TEMP/authority-harness.log"
          grep -Fq 'LAN_LOCAL_COMMAND_TRANSACTION_PASS' "$RUNNER_TEMP/authority-harness.log"

          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT count(*) FROM authority_snapshots WHERE status='ACTIVE';")" = "1"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT authority_version FROM authority_snapshots WHERE status='ACTIVE';")" = "AUTH-TEST-2"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT status FROM authority_snapshots WHERE authority_version='AUTH-TEST-1';")" = "REPLACED"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='authority_snapshot_version';")" = "AUTH-TEST-2"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT count(*) FROM sqlite_master WHERE type='index' AND name='ux_authority_snapshot_active';")" = "1"

          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT entity_version FROM module_current_state WHERE state_key='employee:EMP-HARNESS-001';")" = "2"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT count(*) FROM module_current_state WHERE state_key='employee:EMP-HARNESS-ROLLBACK';")" = "0"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT count(*) FROM edge_events;")" = "2"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT count(*) FROM edge_events WHERE idempotency_key='IDEM-HARNESS-ROLLBACK';")" = "0"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT count(*) FROM edge_events WHERE authority_snapshot_version='AUTH-TEST-2';")" = "2"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT count(*) FROM edge_reconciliation_state WHERE state='PENDING';")" = "2"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT count(*) FROM cloud_sync_outbox WHERE state='PENDING';")" = "2"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT count(*) FROM google_projection_outbox WHERE state='PENDING';")" = "1"

          test "$(sqlite3 "$DATA_ROOT/edge.db" "PRAGMA foreign_key_check;")" = ""
          test "$(sqlite3 "$DATA_ROOT/edge.db" "PRAGMA quick_check;")" = "ok"

      - name: Verify restart sees active authority but stays fail-closed
        shell: bash
        run: |
          set -euo pipefail
          VHDCHY_ENV=BETA \
          VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
          VHDCHY_LAN_PORT=17911 \
          VHDCHY_LAN_DATA_ROOT="$DATA_ROOT" \
            dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$RUNNER_TEMP/lan-restart.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ok=false
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lan-restart.log" || true
              exit 1
            fi
            code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/sync.json" -w '%{http_code}' http://127.0.0.1:17911/api/v1/sync/status || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 0.5
          done
          test "$ok" = "true"
          jq -e '.authoritySnapshotVersion == "AUTH-TEST-2" and .readiness == "EDGE_EMPTY" and .pendingCloudSync == 2 and .pendingGoogleWork == 1' "$RUNNER_TEMP/sync.json" >/dev/null
          code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/mutation.json" -w '%{http_code}' -X POST http://127.0.0.1:17911/api/v1/data/test)
          test "$code" = "503"
          jq -e '.error.code == "RUNTIME_DEPENDENCY_UNAVAILABLE"' "$RUNNER_TEMP/mutation.json" >/dev/null
          kill "$pid"
          wait "$pid" || true
          trap - EXIT
