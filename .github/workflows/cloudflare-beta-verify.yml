name: Cloudflare BETA verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/cloudflare-beta-verify.json'
      - '.github/scripts/cloudflare-verify.mjs'
      - '.github/workflows/cloudflare-beta-verify.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-beta-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: beta
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Require main branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout source authority
        uses: actions/checkout@v4

      - name: Verify D1 binding
        env:
          VHDCHY_VERIFY_ONLY_BINDING: DB
        run: node .github/scripts/cloudflare-verify.mjs

      - name: Verify APP_ENV binding
        env:
          VHDCHY_VERIFY_ONLY_BINDING: APP_ENV
        run: node .github/scripts/cloudflare-verify.mjs

      - name: Verify LAN reconciliation key-id binding
        env:
          VHDCHY_VERIFY_ONLY_BINDING: LAN_RECONCILIATION_KEY_ID
        run: node .github/scripts/cloudflare-verify.mjs

      - name: Verify LAN reconciliation shared-secret binding
        env:
          VHDCHY_VERIFY_ONLY_BINDING: LAN_RECONCILIATION_SHARED_SECRET
        run: node .github/scripts/cloudflare-verify.mjs

      - name: Verify Cloudflare BETA identity and reconciliation D1 schema read-only
        run: node .github/scripts/cloudflare-verify.mjs
