name: Cloudflare BETA verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/cloudflare-beta-verify.json'

permissions:
  contents: read

concurrency:
  group: cloudflare-beta-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: beta
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Require main branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout source authority
        uses: actions/checkout@v4

      - name: Evaluate verification gate
        id: gate
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cmd = JSON.parse(fs.readFileSync('.github/dispatch/cloudflare-beta-verify.json', 'utf8'));
          const isPush = process.env.GITHUB_EVENT_NAME === 'push';
          if (isPush && cmd.enabled !== true) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_run=false\n');
            console.log('Cloudflare verification gate disabled; clean no-op.');
            process.exit(0);
          }
          if (cmd.target !== 'beta') throw new Error('Dispatch target must be beta');
          if (cmd.operation !== 'verify') throw new Error('Dispatch operation must be verify');
          if (!cmd.request_id || typeof cmd.request_id !== 'string') throw new Error('Dispatch request_id is required');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'should_run=true\n');
          console.log(`Authorized Cloudflare verification request: ${cmd.request_id}`);
          NODE

      - name: Verify Cloudflare BETA identity and expected resources
        if: steps.gate.outputs.should_run == 'true'
        run: node .github/scripts/cloudflare-verify.mjs
