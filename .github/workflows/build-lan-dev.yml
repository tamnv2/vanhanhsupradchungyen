name: Build LAN DEV artifacts

on:
  push:
    branches: [main]
    paths:
      - 'android-pilot/**'
      - 'lan-agent/**'
      - '.github/workflows/build-lan-dev.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  LAN_PILOT_VERSION: 0.1.${{ github.run_number }}

concurrency:
  group: lan-dev-build
  cancel-in-progress: true

jobs:
  lan-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish portable win-x64 Agent
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish lan-agent/Vhdchy.LanAgent.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:Version="$LAN_PILOT_VERSION" \
            -o out/agent
          printf '%s\n' "$LAN_PILOT_VERSION" > out/agent/VERSION.txt
          (cd out/agent && zip -r ../VHDCHY-LAN-Agent-DEV-win-x64.zip .)
          sha256sum out/VHDCHY-LAN-Agent-DEV-win-x64.zip > out/VHDCHY-LAN-Agent-DEV-win-x64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lan-agent-dev
          path: |
            out/VHDCHY-LAN-Agent-DEV-win-x64.zip
            out/VHDCHY-LAN-Agent-DEV-win-x64.zip.sha256
          if-no-files-found: error

  android-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android-pilot :app:assembleDebug --no-daemon
          mkdir -p out
          cp android-pilot/app/build/outputs/apk/debug/app-debug.apk out/VHDCHY-Transport-BETA-debug.apk
          sha256sum out/VHDCHY-Transport-BETA-debug.apk > out/VHDCHY-Transport-BETA-debug.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging out/VHDCHY-Transport-BETA-debug.apk | head -n 1
      - uses: actions/upload-artifact@v4
        with:
          name: android-transport-dev
          path: |
            out/VHDCHY-Transport-BETA-debug.apk
            out/VHDCHY-Transport-BETA-debug.apk.sha256
          if-no-files-found: error
