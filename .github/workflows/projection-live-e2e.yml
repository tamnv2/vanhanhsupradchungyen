name: Projection BETA live E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/projection-live-e2e.json'
      - '.github/scripts/projection-live-e2e.mjs'
      - '.github/workflows/projection-live-e2e.yml'
      - 'service/google-gateway/**'

permissions:
  contents: read

concurrency:
  group: projection-beta-live-e2e
  cancel-in-progress: false

jobs:
  projection-live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: beta
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}

    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate isolated E2E dispatch
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          jq -e '(.enabled == true or .enabled == false) and .target == "beta" and .operation == "projection_live_e2e" and (.request_id | type == "string" and length > 0)' .github/dispatch/projection-live-e2e.json >/dev/null
          enabled="$(jq -r '.enabled' .github/dispatch/projection-live-e2e.json)"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then echo 'PROJECTION_LIVE_E2E_DISABLED_NOOP'; fi

      - name: Resolve exact or source-equivalent live Worker build
        if: steps.gate.outputs.enabled == 'true'
        id: worker-build
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 --connect-timeout 10 https://beta.supra.cc.cd/health)"
          live_build="$(printf '%s' "$health" | jq -r '.build // empty')"
          if [[ ! "$live_build" =~ ^[0-9a-f]{40}$ ]]; then
            echo "PROJECTION_E2E_WORKER_BUILD_INVALID value=$live_build"
            exit 1
          fi

          if [ "$live_build" = "$GITHUB_SHA" ]; then
            echo "PROJECTION_E2E_WORKER_BUILD_EXACT build=$live_build"
          else
            if ! git cat-file -e "${live_build}^{commit}" 2>/dev/null; then
              echo "PROJECTION_E2E_WORKER_BUILD_NOT_IN_HISTORY build=$live_build head=$GITHUB_SHA"
              exit 1
            fi

            runtime_paths=(
              service/worker
              config/projections.beta.json
              .github/scripts/cloudflare-worker-upload.mjs
              .github/workflows/cloudflare-beta-deploy-v2.yml
              .github/dispatch/cloudflare-beta-v2.json
            )
            if ! git diff --quiet "$live_build" "$GITHUB_SHA" -- "${runtime_paths[@]}"; then
              echo "PROJECTION_E2E_WORKER_SOURCE_DRIFT live=$live_build head=$GITHUB_SHA"
              git diff --name-only "$live_build" "$GITHUB_SHA" -- "${runtime_paths[@]}"
              exit 1
            fi
            echo "PROJECTION_E2E_WORKER_SOURCE_EQUIVALENT live=$live_build head=$GITHUB_SHA"
          fi

          echo "worker_build_sha=$live_build" >> "$GITHUB_OUTPUT"

      - name: Run isolated D1 cron Google Sheet E2E and cleanup
        if: steps.gate.outputs.enabled == 'true'
        env:
          E2E_WORKER_BUILD_SHA: ${{ steps.worker-build.outputs.worker_build_sha }}
        run: GITHUB_SHA="$E2E_WORKER_BUILD_SHA" node .github/scripts/projection-live-e2e.mjs
