name: Validate LAN primary credential authentication

on:
  push:
    branches: [main]
    paths:
      - 'contracts/authority-snapshot.v2.schema.json'
      - 'lan-service/**'
      - 'lan-primary-auth-harness/**'
      - '.github/workflows/lan-primary-auth-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lan-primary-auth-harness
  cancel-in-progress: true

jobs:
  primary-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build LAN runtime and primary-auth harness
        shell: bash
        run: |
          set -euo pipefail
          dotnet build lan-service/Vhdchy.LanService.csproj -c Release
          dotnet build lan-primary-auth-harness/Vhdchy.LanPrimaryAuth.Harness.csproj -c Release

      - name: Initialize real EdgeStore
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/vhdchy-primary-auth-harness"
          rm -rf "$data_root"
          mkdir -p "$data_root"
          echo "DATA_ROOT=$data_root" >> "$GITHUB_ENV"

          VHDCHY_ENV=BETA \
          VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
          VHDCHY_LAN_PORT=17914 \
          VHDCHY_LAN_DATA_ROOT="$data_root" \
            dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$RUNNER_TEMP/lan-init.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ok=false
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lan-init.log" || true
              exit 1
            fi
            code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/health-init.json" -w '%{http_code}' http://127.0.0.1:17914/health || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 0.5
          done
          test "$ok" = "true"
          kill "$pid"
          wait "$pid" || true
          trap - EXIT
          test -s "$data_root/edge.db"

      - name: Run primary-auth and session-chain vectors
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project lan-primary-auth-harness/Vhdchy.LanPrimaryAuth.Harness.csproj -c Release --no-build -- "$DATA_ROOT/edge.db" | tee "$RUNNER_TEMP/primary-auth.log"
          grep -Fq 'LAN_PRIMARY_AUTH_HARNESS_PASS' "$RUNNER_TEMP/primary-auth.log"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT count(*) FROM authority_snapshots WHERE status='ACTIVE';")" = "1"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT authority_version FROM authority_snapshots WHERE status='ACTIVE';")" = "AUTH-LOGIN-V1-LEGACY"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT count(*) FROM lan_auth_sessions;")" = "1"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "PRAGMA foreign_key_check;")" = ""
          test "$(sqlite3 "$DATA_ROOT/edge.db" "PRAGMA quick_check;")" = "ok"
