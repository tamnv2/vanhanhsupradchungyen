name: Cloudflare STABLE read-only inspection

on:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/cloudflare-stable-inspect.json'

permissions:
  contents: read

concurrency:
  group: cloudflare-stable-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: stable
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_WORKER: vhdchy-stable
      EXPECTED_D1: vhdchy-data-stable

    steps:
      - uses: actions/checkout@v4
      - name: Validate fixed read-only dispatch
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.enabled == true and .target == "stable" and .operation == "inspect_cloudflare_stable_read_only"' .github/dispatch/cloudflare-stable-inspect.json >/dev/null
      - name: Inspect STABLE target resources without mutation
        run: node .github/scripts/cloudflare-inspect-fixed-target.mjs
