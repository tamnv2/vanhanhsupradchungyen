name: Cloudflare D1 BETA additive migration 0010 auth V6 email OTP

on:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/cloudflare-beta-additive-0010.json'
      - '.github/workflows/cloudflare-beta-additive-0010.yml'

permissions:
  contents: read

concurrency:
  group: cloudflare-d1-beta-additive-0010
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: beta
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: 37eb7d59-05c0-4ba2-8162-cb6a9fe5d492
      MIGRATION_FILE: service/worker/migrations/0010_auth_v6_email_otp.sql
      MIGRATION_BLOB_SHA: c2a6b4561ab9b4b0f2f214a9e150be057a30b50e

    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4

      - name: Read fixed dispatch state
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          jq -e '
            .target == "beta" and
            .operation == "migrate_auth_v6_email_otp_0010" and
            (.enabled == true or .enabled == false)
          ' .github/dispatch/cloudflare-beta-additive-0010.json >/dev/null
          enabled="$(jq -r '.enabled' .github/dispatch/cloudflare-beta-additive-0010.json)"
          echo "enabled=${enabled}" >> "$GITHUB_OUTPUT"

      - name: Safe idle when disabled
        if: steps.dispatch.outputs.enabled != 'true'
        run: echo 'D1_ADDITIVE_0010_IDLE enabled=false; provider mutation skipped'

      - name: Validate reviewed migration source identity
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s "$MIGRATION_FILE"
          actual="$(git hash-object "$MIGRATION_FILE")"
          test "$actual" = "$MIGRATION_BLOB_SHA"
          echo "MIGRATION_SOURCE_IDENTITY_PASS blob=${actual}"

      - name: Read-only provider preflight
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/cloudflare-verify.mjs | tee "$RUNNER_TEMP/d1-0010-preflight.log"

      - name: Enforce exact additive precondition
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const log = fs.readFileSync(`${process.env.RUNNER_TEMP}/d1-0010-preflight.log`, 'utf8');
          function value(prefix) {
            const line = log.split(/\r?\n/).find(x => x.startsWith(prefix));
            if (!line) throw new Error(`Missing preflight evidence: ${prefix}`);
            return line.slice(prefix.length);
          }
          const expectedAccount = '1b1695e4f2a3abfe08dc475b352c7f42';
          const expectedDb = '37eb7d59-05c0-4ba2-8162-cb6a9fe5d492';
          if (value('CLOUDFLARE_ACCOUNT_ID=') !== expectedAccount) throw new Error('PRECHECK account mismatch');
          if (value('D1_DATABASE_ID=') !== expectedDb) throw new Error('PRECHECK D1 database ID mismatch');
          if (value('D1_SCHEMA_VERSION=') !== 'business_core_v3') throw new Error('PRECHECK schema mismatch');
          const tables = JSON.parse(value('D1_READ_ONLY_TABLES=')).filter(x => x !== '_cf_KV');
          for (const required of ['auth_users', 'auth_audit_events', 'vhdchy_meta']) {
            if (!tables.includes(required)) throw new Error(`PRECHECK required table missing: ${required}`);
          }
          if (tables.includes('auth_email_otp_challenges')) {
            throw new Error('PRECHECK auth_email_otp_challenges already exists; refuse replay and verify existing state instead');
          }
          console.log(`D1_ADDITIVE_0010_PRECHECK_PASS tables=${tables.length}`);
          NODE

      - name: Apply reviewed additive migration 0010
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const sql = fs.readFileSync(process.env.MIGRATION_FILE, 'utf8').trim();
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const databaseId = process.env.D1_DATABASE_ID;
          if (!accountId || !token || !databaseId || !sql) throw new Error('Missing approved migration context');
          const url = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}/d1/database/${encodeURIComponent(databaseId)}/query`;
          async function main() {
            const response = await fetch(url, {
              method: 'POST',
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
              body: JSON.stringify({ sql })
            });
            let payload;
            try { payload = await response.json(); } catch { throw new Error(`Cloudflare returned non-JSON HTTP ${response.status}`); }
            if (!response.ok || payload?.success !== true) {
              throw new Error(`D1 additive migration API failed HTTP ${response.status}: ${JSON.stringify(payload?.errors || []).slice(0, 1200)}`);
            }
            const results = Array.isArray(payload.result) ? payload.result : [payload.result];
            if (!results.length || results.some(item => !item || item.success !== true)) {
              throw new Error('D1 additive migration contains a failed statement');
            }
            console.log(`D1_ADDITIVE_0010_APPLY_PASS results=${results.length}`);
          }
          main().catch(error => { console.error(error.message); process.exit(1); });
          NODE

      - name: Read-only provider postflight
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/cloudflare-verify.mjs | tee "$RUNNER_TEMP/d1-0010-postflight.log"

      - name: Enforce additive post-state and row invariance
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          function parse(path) {
            const log = fs.readFileSync(path, 'utf8');
            const value = prefix => {
              const line = log.split(/\r?\n/).find(x => x.startsWith(prefix));
              if (!line) throw new Error(`Missing evidence ${prefix} in ${path}`);
              return line.slice(prefix.length);
            };
            return {
              schema: value('D1_SCHEMA_VERSION='),
              tables: JSON.parse(value('D1_READ_ONLY_TABLES=')).filter(x => x !== '_cf_KV').sort(),
              counts: JSON.parse(value('D1_READ_ONLY_ROW_COUNTS='))
            };
          }
          const pre = parse(`${process.env.RUNNER_TEMP}/d1-0010-preflight.log`);
          const post = parse(`${process.env.RUNNER_TEMP}/d1-0010-postflight.log`);
          if (pre.schema !== 'business_core_v3' || post.schema !== 'business_core_v3') throw new Error('POSTCHECK schema marker changed');
          if (pre.tables.includes('auth_email_otp_challenges')) throw new Error('POSTCHECK invalid pre-state');
          const expectedTables = [...pre.tables, 'auth_email_otp_challenges'].sort();
          if (JSON.stringify(post.tables) !== JSON.stringify(expectedTables)) {
            throw new Error(`POSTCHECK table delta mismatch expected=${JSON.stringify(expectedTables)} actual=${JSON.stringify(post.tables)}`);
          }
          if (post.counts.auth_email_otp_challenges !== 0) throw new Error('POSTCHECK new OTP table is not empty');
          const postExistingCounts = { ...post.counts };
          delete postExistingCounts.auth_email_otp_challenges;
          if (JSON.stringify(postExistingCounts) !== JSON.stringify(pre.counts)) {
            throw new Error('POSTCHECK existing table row counts changed during additive migration');
          }
          console.log(`D1_ADDITIVE_0010_ROW_INVARIANCE_PASS tables=${post.tables.length}`);
          NODE

      - name: Verify OTP indexes and D1 integrity
        if: steps.dispatch.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const databaseId = process.env.D1_DATABASE_ID;
          const url = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(accountId)}/d1/database/${encodeURIComponent(databaseId)}/query`;
          async function query(sql) {
            const response = await fetch(url, {
              method: 'POST',
              headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
              body: JSON.stringify({ sql })
            });
            const payload = await response.json();
            if (!response.ok || payload?.success !== true) throw new Error(`Integrity query failed: ${JSON.stringify(payload?.errors || [])}`);
            const first = Array.isArray(payload.result) ? payload.result[0] : payload.result;
            if (!first || first.success !== true) throw new Error('Integrity query result failed');
            return Array.isArray(first.results) ? first.results : [];
          }
          async function main() {
            const indexes = await query("SELECT name FROM sqlite_schema WHERE type='index' AND tbl_name='auth_email_otp_challenges' AND name NOT LIKE 'sqlite_autoindex%' ORDER BY name");
            const actual = indexes.map(x => String(x.name)).sort();
            const expected = [
              'ix_auth_email_otp_cooldown',
              'ix_auth_email_otp_state_expiry',
              'ux_auth_email_otp_issued',
              'ux_auth_email_otp_requested'
            ].sort();
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`OTP index mismatch expected=${JSON.stringify(expected)} actual=${JSON.stringify(actual)}`);
            }
            const fk = await query('PRAGMA foreign_key_check');
            if (fk.length !== 0) throw new Error(`foreign_key_check failed: ${JSON.stringify(fk)}`);
            const quick = await query('PRAGMA quick_check');
            const first = quick[0] || {};
            const value = String(first.quick_check ?? first.integrity_check ?? Object.values(first)[0] ?? '').toLowerCase();
            if (value !== 'ok') throw new Error(`quick_check failed: ${JSON.stringify(quick)}`);
            console.log('D1_ADDITIVE_0010_PASS indexes=4 integrity=PASS');
          }
          main().catch(error => { console.error(error.message); process.exit(1); });
          NODE
