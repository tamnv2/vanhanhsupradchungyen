name: Validate LAN Slice-1 business adapter

on:
  push:
    branches: [main]
    paths:
      - 'lan-service/**'
      - 'lan-slice1-business-harness/**'
      - '.github/workflows/lan-slice1-business-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lan-slice1-business-harness
  cancel-in-progress: true

jobs:
  slice1-business:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build LAN runtime and Slice-1 business harness
        shell: bash
        run: |
          set -euo pipefail
          dotnet build lan-service/Vhdchy.LanService.csproj -c Release
          dotnet build lan-slice1-business-harness/Vhdchy.LanSlice1Business.Harness.csproj -c Release

      - name: Initialize real EdgeStore
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/vhdchy-slice1-business"
          rm -rf "$data_root"
          mkdir -p "$data_root"
          echo "DATA_ROOT=$data_root" >> "$GITHUB_ENV"

          VHDCHY_ENV=BETA \
          VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
          VHDCHY_LAN_PORT=17915 \
          VHDCHY_LAN_DATA_ROOT="$data_root" \
            dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$RUNNER_TEMP/lan-init.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ok=false
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lan-init.log" || true
              exit 1
            fi
            code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/health.json" -w '%{http_code}' http://127.0.0.1:17915/health || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 0.5
          done
          test "$ok" = "true"
          jq -e '.readiness == "EDGE_EMPTY" and .businessMutationEnabled == false' "$RUNNER_TEMP/health.json" >/dev/null
          kill "$pid"
          wait "$pid" || true
          trap - EXIT

      - name: Execute reviewed Slice-1 business vectors
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project lan-slice1-business-harness/Vhdchy.LanSlice1Business.Harness.csproj -c Release --no-build -- "$DATA_ROOT/edge.db" | tee "$RUNNER_TEMP/slice1-business.log"
          grep -Fq 'LAN_SLICE1_BUSINESS_HARNESS_PASS' "$RUNNER_TEMP/slice1-business.log"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "PRAGMA foreign_key_check;")" = ""
          test "$(sqlite3 "$DATA_ROOT/edge.db" "PRAGMA quick_check;")" = "ok"

      - name: Prove public mutation remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          VHDCHY_ENV=BETA \
          VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
          VHDCHY_LAN_PORT=17915 \
          VHDCHY_LAN_DATA_ROOT="$DATA_ROOT" \
            dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$RUNNER_TEMP/lan-restart.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ok=false
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lan-restart.log" || true
              exit 1
            fi
            code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/health-restart.json" -w '%{http_code}' http://127.0.0.1:17915/health || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 0.5
          done
          test "$ok" = "true"
          code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/mutation.json" -w '%{http_code}' -X POST http://127.0.0.1:17915/api/v1/data/test)
          test "$code" = "503"
          jq -e '.error.code == "RUNTIME_DEPENDENCY_UNAVAILABLE"' "$RUNNER_TEMP/mutation.json" >/dev/null
          kill "$pid"
          wait "$pid" || true
          trap - EXIT
