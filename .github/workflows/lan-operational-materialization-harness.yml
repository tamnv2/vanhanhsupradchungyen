name: Validate LAN operational state materialization

on:
  push:
    branches: [main]
    paths:
      - 'lan-service/**'
      - 'lan-operational-materialization-harness/**'
      - '.github/workflows/lan-operational-materialization-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lan-operational-materialization-harness
  cancel-in-progress: true

jobs:
  materialization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build LAN runtime and materialization harness
        shell: bash
        run: |
          set -euo pipefail
          dotnet build lan-service/Vhdchy.LanService.csproj -c Release
          dotnet build lan-operational-materialization-harness/Vhdchy.LanOperationalMaterialization.Harness.csproj -c Release

      - name: Initialize real EdgeStore
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/vhdchy-materialization-harness"
          rm -rf "$data_root"
          mkdir -p "$data_root"
          echo "DATA_ROOT=$data_root" >> "$GITHUB_ENV"

          VHDCHY_ENV=BETA \
          VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
          VHDCHY_LAN_PORT=17913 \
          VHDCHY_LAN_DATA_ROOT="$data_root" \
            dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$RUNNER_TEMP/lan-init.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ok=false
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lan-init.log" || true
              exit 1
            fi
            code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/health-init.json" -w '%{http_code}' http://127.0.0.1:17913/health || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 0.5
          done
          test "$ok" = "true"
          jq -e '.readiness == "EDGE_EMPTY" and .businessMutationEnabled == false' "$RUNNER_TEMP/health-init.json" >/dev/null
          kill "$pid"
          wait "$pid" || true
          trap - EXIT

      - name: Prove materialization rollback and pending-local guard
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project lan-operational-materialization-harness/Vhdchy.LanOperationalMaterialization.Harness.csproj -c Release --no-build -- "$DATA_ROOT/edge.db" | tee "$RUNNER_TEMP/materialization.log"
          grep -Fq 'LAN_OPERATIONAL_MATERIALIZATION_HARNESS_PASS materialized=3 rollback=PASS pendingLocalGuard=PASS atomic=PASS' "$RUNNER_TEMP/materialization.log"

          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT snapshot_version FROM operational_snapshot_state WHERE status='ACTIVE';")" = "OP-MAT-1"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT COUNT(*) FROM operational_snapshot_state WHERE snapshot_version IN ('OP-MAT-COLLISION','OP-MAT-2');")" = "0"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='slice1_materialized_snapshot_version';")" = "OP-MAT-1"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='slice1_materialized_state_count';")" = "3"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT COUNT(*) FROM module_current_state WHERE module_id='IDENTITY_EMPLOYEE_ATTENDANCE';")" = "4"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT COUNT(*) FROM edge_events;")" = "1"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT COUNT(*) FROM cloud_sync_outbox WHERE state='PENDING';")" = "1"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "PRAGMA foreign_key_check;")" = ""
          test "$(sqlite3 "$DATA_ROOT/edge.db" "PRAGMA quick_check;")" = "ok"

      - name: Prove public mutation remains fail-closed after materialized local state
        shell: bash
        run: |
          set -euo pipefail
          VHDCHY_ENV=BETA \
          VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
          VHDCHY_LAN_PORT=17913 \
          VHDCHY_LAN_DATA_ROOT="$DATA_ROOT" \
            dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$RUNNER_TEMP/lan-restart.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ok=false
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lan-restart.log" || true
              exit 1
            fi
            code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/health-restart.json" -w '%{http_code}' http://127.0.0.1:17913/health || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 0.5
          done
          test "$ok" = "true"
          jq -e '.businessMutationEnabled == false' "$RUNNER_TEMP/health-restart.json" >/dev/null
          code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/mutation.json" -w '%{http_code}' -X POST http://127.0.0.1:17913/api/v1/data/test)
          test "$code" = "503"
          jq -e '.error.code == "RUNTIME_DEPENDENCY_UNAVAILABLE"' "$RUNNER_TEMP/mutation.json" >/dev/null
          kill "$pid"
          wait "$pid" || true
          trap - EXIT
