name: Validate LAN fail-closed readiness gate

on:
  push:
    branches: [main]
    paths:
      - 'lan-service/**'
      - 'lan-service-harness/**'
      - 'lan-readiness-harness/**'
      - '.github/workflows/lan-readiness-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lan-readiness-harness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build LAN runtime and harnesses
        shell: bash
        run: |
          set -euo pipefail
          dotnet build lan-service/Vhdchy.LanService.csproj -c Release
          dotnet build lan-service-harness/Vhdchy.LanService.Harness.csproj -c Release
          dotnet build lan-readiness-harness/Vhdchy.LanReadiness.Harness.csproj -c Release

      - name: Initialize real EdgeStore
        shell: bash
        run: |
          set -euo pipefail
          data_root="$RUNNER_TEMP/vhdchy-readiness-harness"
          rm -rf "$data_root"
          mkdir -p "$data_root"
          echo "DATA_ROOT=$data_root" >> "$GITHUB_ENV"

          VHDCHY_ENV=BETA \
          VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
          VHDCHY_LAN_PORT=17912 \
          VHDCHY_LAN_DATA_ROOT="$data_root" \
            dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$RUNNER_TEMP/lan-init.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ok=false
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lan-init.log" || true
              exit 1
            fi
            code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/health-init.json" -w '%{http_code}' http://127.0.0.1:17912/health || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 0.5
          done
          test "$ok" = "true"
          jq -e '.readiness == "EDGE_EMPTY" and .businessMutationEnabled == false' "$RUNNER_TEMP/health-init.json" >/dev/null
          kill "$pid"
          wait "$pid" || true
          trap - EXIT

      - name: Populate synchronized authority and operational evidence
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project lan-service-harness/Vhdchy.LanService.Harness.csproj -c Release --no-build -- "$DATA_ROOT/edge.db" | tee "$RUNNER_TEMP/base-harness.log"
          grep -Fq 'LAN_AUTHORITY_SNAPSHOT_HARNESS_PASS' "$RUNNER_TEMP/base-harness.log"
          grep -Fq 'LAN_AUTHORIZATION_HARNESS_PASS' "$RUNNER_TEMP/base-harness.log"
          grep -Fq 'LAN_OPERATIONAL_SNAPSHOT_HARNESS_PASS' "$RUNNER_TEMP/base-harness.log"
          grep -Fq 'LAN_LOCAL_COMMAND_TRANSACTION_PASS' "$RUNNER_TEMP/base-harness.log"

      - name: Prove readiness remains closed until reviewed Slice-1 adapter exists
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project lan-readiness-harness/Vhdchy.LanReadiness.Harness.csproj -c Release --no-build -- "$DATA_ROOT/edge.db" | tee "$RUNNER_TEMP/readiness-harness.log"
          grep -Fq 'LAN_READINESS_HARNESS_PASS' "$RUNNER_TEMP/readiness-harness.log"

          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='authority_snapshot_version';")" = "AUTH-TEST-2"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='operational_snapshot_version';")" = "OP-TEST-2"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='operational_snapshot_authority_version';")" = "AUTH-TEST-2"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='readiness';")" = "EDGE_EMPTY"
          test "$(sqlite3 "$DATA_ROOT/edge.db" "PRAGMA foreign_key_check;")" = ""
          test "$(sqlite3 "$DATA_ROOT/edge.db" "PRAGMA quick_check;")" = "ok"

      - name: Prove public mutation remains fail-closed after restart
        shell: bash
        run: |
          set -euo pipefail
          VHDCHY_ENV=BETA \
          VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
          VHDCHY_LAN_PORT=17912 \
          VHDCHY_LAN_DATA_ROOT="$DATA_ROOT" \
            dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$RUNNER_TEMP/lan-restart.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ok=false
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lan-restart.log" || true
              exit 1
            fi
            code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/sync.json" -w '%{http_code}' http://127.0.0.1:17912/api/v1/sync/status || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 0.5
          done
          test "$ok" = "true"
          jq -e '.authoritySnapshotVersion == "AUTH-TEST-2" and .operationalSnapshotVersion == "OP-TEST-2" and .readiness == "EDGE_EMPTY"' "$RUNNER_TEMP/sync.json" >/dev/null
          code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/mutation.json" -w '%{http_code}' -X POST http://127.0.0.1:17912/api/v1/data/test)
          test "$code" = "503"
          jq -e '.error.code == "RUNTIME_DEPENDENCY_UNAVAILABLE"' "$RUNNER_TEMP/mutation.json" >/dev/null
          kill "$pid"
          wait "$pid" || true
          trap - EXIT
