name: Validate LAN fail-closed readiness gate

on:
  push:
    branches: [main]
    paths:
      - 'lan-service/**'
      - 'lan-service-harness/**'
      - 'lan-readiness-harness/**'
      - '.github/workflows/lan-readiness-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lan-readiness-harness
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build LAN runtime and harnesses
        shell: bash
        run: |
          set -euo pipefail
          dotnet build lan-service/Vhdchy.LanService.csproj -c Release
          dotnet build lan-service-harness/Vhdchy.LanService.Harness.csproj -c Release
          dotnet build lan-readiness-harness/Vhdchy.LanReadiness.Harness.csproj -c Release

      - name: Initialize isolated real EdgeStores
        shell: bash
        run: |
          set -euo pipefail
          base_root="$RUNNER_TEMP/vhdchy-readiness-base"
          readiness_root="$RUNNER_TEMP/vhdchy-readiness-target"
          rm -rf "$base_root" "$readiness_root"
          mkdir -p "$base_root" "$readiness_root"
          echo "BASE_DATA_ROOT=$base_root" >> "$GITHUB_ENV"
          echo "READINESS_DATA_ROOT=$readiness_root" >> "$GITHUB_ENV"

          initialize_store() {
            local root="$1"
            local port="$2"
            local log="$3"
            local health="$4"

            VHDCHY_ENV=BETA \
            VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
            VHDCHY_LAN_PORT="$port" \
            VHDCHY_LAN_DATA_ROOT="$root" \
              dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$log" 2>&1 &
            local pid=$!
            trap 'kill '"$pid"' 2>/dev/null || true' RETURN

            local ok=false
            for i in $(seq 1 30); do
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "$log" || true
                return 1
              fi
              local code
              code=$(curl --noproxy '*' -sS -o "$health" -w '%{http_code}' "http://127.0.0.1:$port/health" || true)
              if [ "$code" = "200" ]; then ok=true; break; fi
              sleep 0.5
            done
            test "$ok" = "true"
            jq -e '.readiness == "EDGE_EMPTY" and .businessMutationEnabled == false' "$health" >/dev/null
            kill "$pid"
            wait "$pid" || true
            trap - RETURN
            test -s "$root/edge.db"
          }

          initialize_store "$base_root" 17912 "$RUNNER_TEMP/lan-init-base.log" "$RUNNER_TEMP/health-init-base.json"
          initialize_store "$readiness_root" 17913 "$RUNNER_TEMP/lan-init-readiness.log" "$RUNNER_TEMP/health-init-readiness.json"

      - name: Prove base snapshot and local-command invariants
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project lan-service-harness/Vhdchy.LanService.Harness.csproj -c Release --no-build -- "$BASE_DATA_ROOT/edge.db" 2>&1 | tee "$RUNNER_TEMP/base-harness.log"
          grep -Fq 'LAN_AUTHORITY_SNAPSHOT_HARNESS_PASS' "$RUNNER_TEMP/base-harness.log"
          grep -Fq 'LAN_AUTHORIZATION_HARNESS_PASS' "$RUNNER_TEMP/base-harness.log"
          grep -Fq 'LAN_OPERATIONAL_SNAPSHOT_HARNESS_PASS' "$RUNNER_TEMP/base-harness.log"
          grep -Fq 'LAN_LOCAL_COMMAND_TRANSACTION_PASS' "$RUNNER_TEMP/base-harness.log"

      - name: Prove readiness advances only to reviewed route-wiring gate
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project lan-readiness-harness/Vhdchy.LanReadiness.Harness.csproj -c Release --no-build -- "$READINESS_DATA_ROOT/edge.db" 2>&1 | tee "$RUNNER_TEMP/readiness-harness.log"
          grep -Fq 'LAN_READINESS_HARNESS_PASS' "$RUNNER_TEMP/readiness-harness.log"
          grep -Fq 'primaryCredentialGate=PASS' "$RUNNER_TEMP/readiness-harness.log"
          grep -Fq 'routeWiringGate=PASS' "$RUNNER_TEMP/readiness-harness.log"

          test "$(sqlite3 "$READINESS_DATA_ROOT/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='authority_snapshot_version';")" = "AUTH-READINESS-V2"
          test "$(sqlite3 "$READINESS_DATA_ROOT/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='operational_snapshot_version';")" = "OP-READINESS-V2"
          test "$(sqlite3 "$READINESS_DATA_ROOT/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='operational_snapshot_authority_version';")" = "AUTH-READINESS-V2"
          test "$(sqlite3 "$READINESS_DATA_ROOT/edge.db" "SELECT meta_value FROM edge_meta WHERE meta_key='readiness';")" = "EDGE_EMPTY"
          test "$(sqlite3 "$READINESS_DATA_ROOT/edge.db" "PRAGMA foreign_key_check;")" = ""
          test "$(sqlite3 "$READINESS_DATA_ROOT/edge.db" "PRAGMA quick_check;")" = "ok"

      - name: Prove public mutation remains fail-closed after restart
        shell: bash
        run: |
          set -euo pipefail
          VHDCHY_ENV=BETA \
          VHDCHY_CLUSTER_ID=PICK_PACK_1291 \
          VHDCHY_LAN_PORT=17912 \
          VHDCHY_LAN_DATA_ROOT="$READINESS_DATA_ROOT" \
            dotnet lan-service/bin/Release/net8.0/VHDCHY.LanService.dll > "$RUNNER_TEMP/lan-restart.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ok=false
          for i in $(seq 1 30); do
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/lan-restart.log" || true
              exit 1
            fi
            code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/sync.json" -w '%{http_code}' http://127.0.0.1:17912/api/v1/sync/status || true)
            if [ "$code" = "200" ]; then ok=true; break; fi
            sleep 0.5
          done
          test "$ok" = "true"
          jq -e '.authoritySnapshotVersion == "AUTH-READINESS-V2" and .operationalSnapshotVersion == "OP-READINESS-V2" and .readiness == "EDGE_EMPTY"' "$RUNNER_TEMP/sync.json" >/dev/null
          code=$(curl --noproxy '*' -sS -o "$RUNNER_TEMP/mutation.json" -w '%{http_code}' -X POST http://127.0.0.1:17912/api/v1/data/test)
          test "$code" = "503"
          jq -e '.error.code == "RUNTIME_DEPENDENCY_UNAVAILABLE"' "$RUNNER_TEMP/mutation.json" >/dev/null
          kill "$pid"
          wait "$pid" || true
          trap - EXIT

      - name: Upload readiness diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lan-readiness-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/base-harness.log
            ${{ runner.temp }}/readiness-harness.log
            ${{ runner.temp }}/lan-init-base.log
            ${{ runner.temp }}/lan-init-readiness.log
            ${{ runner.temp }}/lan-restart.log
            ${{ runner.temp }}/health-init-base.json
            ${{ runner.temp }}/health-init-readiness.json
            ${{ runner.temp }}/sync.json
            ${{ runner.temp }}/mutation.json
