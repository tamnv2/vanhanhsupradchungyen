name: Google Gateway BETA sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/dispatch/gas-beta-sync.json'

permissions:
  contents: read

concurrency:
  group: gas-beta-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: beta
    env:
      APP_ENV: ${{ vars.APP_ENV }}
      OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
      GOOGLE_SHEETS_PROJECTION_ID: ${{ vars.GOOGLE_SHEETS_PROJECTION_ID }}
      GAS_SCRIPT_ID: ${{ vars.GAS_SCRIPT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}

    steps:
      - name: Require main branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"

      - name: Checkout source authority
        uses: actions/checkout@v4

      - name: Validate autonomous dispatch request
        if: github.event_name == 'push'
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = '.github/dispatch/gas-beta-sync.json';
          const cmd = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (cmd.enabled !== true) throw new Error('Dispatch must be enabled');
          if (cmd.target !== 'beta') throw new Error('Dispatch target must be beta');
          if (!['sync', 'deploy'].includes(cmd.operation)) throw new Error('Dispatch operation must be sync or deploy');
          if (!cmd.request_id || typeof cmd.request_id !== 'string') throw new Error('Dispatch request_id is required');
          console.log(`Authorized autonomous request: ${cmd.request_id} / ${cmd.operation}`);
          NODE

      - name: Sync and verify Google Gateway HEAD
        run: node .github/scripts/gas-sync.mjs
