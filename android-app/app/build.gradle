plugins {
    id 'com.android.application'
}

def runNumber = System.getenv('GITHUB_RUN_NUMBER') ?: '1'
def releaseVersion = System.getenv('VHDCHY_VERSION') ?: "0.1.${runNumber}"

android {
    namespace 'vn.vhdchy.app'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.vhdchy.beta'
        minSdk 23
        targetSdk 35
        versionCode Integer.parseInt(runNumber)
        versionName releaseVersion
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def transportHarnessClasses = layout.buildDirectory.dir('transport-harness/classes')

tasks.register('compileTransportBehaviorHarness', JavaCompile) {
    source = files(
        fileTree('src/main/java/vn/vhdchy/app/transport') { include '*.java' },
        fileTree('../transport-harness') { include '**/*.java' }
    )
    classpath = files()
    destinationDirectory.set(transportHarnessClasses)
    options.release.set(17)
}

tasks.register('transportBehaviorHarness', JavaExec) {
    dependsOn tasks.named('compileTransportBehaviorHarness')
    classpath = files(transportHarnessClasses)
    mainClass.set('vn.vhdchy.app.transport.TransportBehaviorHarness')
}

tasks.register('reconnectBehaviorHarness', JavaExec) {
    dependsOn tasks.named('compileTransportBehaviorHarness')
    classpath = files(transportHarnessClasses)
    mainClass.set('vn.vhdchy.app.transport.ReconnectBehaviorHarness')
}

tasks.register('endpointAcquisitionHarness', JavaExec) {
    dependsOn tasks.named('compileTransportBehaviorHarness')
    classpath = files(transportHarnessClasses)
    mainClass.set('vn.vhdchy.app.transport.EndpointAcquisitionHarness')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('transportBehaviorHarness')
    dependsOn tasks.named('reconnectBehaviorHarness')
    dependsOn tasks.named('endpointAcquisitionHarness')
}

dependencies {
}
